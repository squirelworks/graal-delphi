name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push replaces the run still going for the same branch or PR, so
# runs that wait on a runner do not pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which client folders this run builds. A pull request builds only the
  # graal-* folders it touches; one that touches common/, scripts/ or
  # this file, a push to main and a manual run build every folder.
  changes:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # graal-3d-* is left to graal-3d.yml, which builds and tests it
          # on Linux and Windows already
          ALL=$(ls -d graal-*/ | tr -d / | grep -v '^graal-3d-' | tr '\n' ' ')
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then B="$ALL"
          else
            CHANGED=$(git diff --name-only "$BASE...$HEAD")
            if echo "$CHANGED" | grep -Eq '^(common|scripts)/|^\.github/workflows/ci\.yml$'; then B="$ALL"
            else
              B=""
              for F in $(echo "$CHANGED" | sed -n 's#^\(graal-[^/]*\)/.*#\1#p' | sort -u); do
                case "$F" in graal-3d-*) continue ;; esac
                if [ -d "$F/src" ]; then B="$B $F"; fi
              done
            fi
          fi
          B=$(echo $B)
          echo "builds=$B" >> "$GITHUB_OUTPUT"
          echo "Builds: ${B:-none}"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.builds != ''
    runs-on: ubuntu-latest
    env:
      BUILDS: ${{ needs.changes.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl libx11-dev g++ zlib1g-dev
      - name: Every client has its Windows resources
        run: python3 scripts/win/make_winres.py --check
      - name: Build (Delphi mode)
        run: scripts/build.sh $BUILDS
      - name: Unit tests
        run: scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/

  loopback:
    needs: [changes, build-and-test]
    runs-on: ubuntu-latest
    env:
      BUILDS: ${{ needs.changes.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: squirelworks/seihai-gserver
          path: seihai-gserver
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl libx11-dev g++ zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build seihai-gserver
        run: cargo build --release --manifest-path seihai-gserver/Cargo.toml
      - name: Build clients
        run: scripts/build.sh $BUILDS
      - name: Log each rebuild into seihai-gserver
        run: |
          for B in $BUILDS; do
            scripts/loopback.sh seihai-gserver/target/release/seihai-gserver "$B"
          done

  windows:
    # Chocolatey's Free Pascal is the 32-bit i386-win32 compiler. That is
    # the target 2.05 itself shipped for, so it is kept.
    needs: changes
    if: needs.changes.outputs.builds != ''
    runs-on: windows-latest
    env:
      BUILDS: ${{ needs.changes.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        shell: pwsh
        run: choco install freepascal -y --no-progress
      - name: Build and test
        shell: bash
        run: |
          export PATH="$(ls -d /c/tools/freepascal/bin/* | head -1):$PATH"
          # The Chocolatey install has no fpc.cfg naming the unit folders,
          # so name them here (Windows path form, with FPC's * wildcard).
          # -WR: relocations, so the exe can carry the ASLR flag
          export FPCFLAGS='-O2 -WR -FuC:\tools\freepascal\units\i386-win32\*'
          ls /c/tools/freepascal/units/i386-win32 | head -5
          scripts/build.sh $BUILDS
          scripts/test.sh
      - name: Check the clients carry version info and a manifest
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem build/*/Graal*.exe) {
            $v = $exe.VersionInfo
            "{0}: {1} {2} / {3}" -f $exe.Directory.Name, $v.ProductName, $v.ProductVersion, $v.FileDescription
            if ($v.ProductName -ne 'graal-delphi' -or $v.CompanyName -ne 'squirelworks') { throw "$($exe.FullName): no version info" }
            $bytes = [IO.File]::ReadAllBytes($exe.FullName)
            if ([Text.Encoding]::ASCII.GetString($bytes).IndexOf('requestedExecutionLevel') -lt 0) { throw "$($exe.FullName): no manifest" }
          }
      # the Windows programs of this run, for trying a PR on a Windows PC
      - uses: actions/upload-artifact@v4
        with:
          name: windows-programs
          path: build/*/*.exe

  macos:
    # macOS runners can wait for hours; it is built for releases only (a
    # manual run or a tag), not for every push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # Homebrew's Free Pascal (aarch64-darwin). The window is Cocoa
    # (common/GWindowCocoa.inc); the tests open none.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: brew install fpc
      - name: Build and test
        run: |
          fpc -iV; fpc -iTP; fpc -iTO
          scripts/build.sh
          scripts/test.sh
